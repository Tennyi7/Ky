  <!-- โหลดฟอนต์ Inter และ Noto Sans Thai เพื่อความคมชัดทั้งไทยและอังกฤษ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- โหลด Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans Thai"', 'system-ui', 'sans-serif']
          }
        }
      }
    };

  <style>
    /* ตั้งค่าพื้นฐานเล็กน้อยสำหรับแอนิเมชันและ Safe Area บนมือถือ */
    html { scroll-behavior: smooth; }
    body {
      font-family: "Inter", "Noto Sans Thai", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .pb-safe { padding-bottom: calc(0.5rem + env(safe-area-inset-bottom, 0px)); }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade { animation: fadeSlide 0.18s ease-out; }
    @keyframes pulseRing {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.45); }
      50% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
    }
    .highlight-pulse { animation: pulseRing 0.9s ease-in-out 2; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

  <!-- พื้นที่เนื้อหาหลัก -->

  <!-- กล่อง Modal กลางจอสำหรับยืนยันและแก้ไขรายการ -->

  <!-- กล่องแจ้งเตือน Toast -->

  <script>
  (() => {
    'use strict';

    /* ============================================================================
     * 1. UTILITIES & DATE HELPERS (ฟังก์ชันช่วยจัดการ DOM, วันที่ และตัวเลข)
     * ============================================================================ */
    const $ = (s, p = document) => p.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const pad = (n) => String(n).padStart(2, '0');
    const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const todayStr = () => ymd(new Date());
    const parseDate = (s) => {
      const [y, m, d] = String(s).split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    };
    const addDays = (s, n) => {
      const d = parseDate(s);
      d.setDate(d.getDate() + n);
      return ymd(d);
    };
    const uid = () => (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2, 9)}`);
    const r1 = (n) => Math.round((Number(n) || 0) * 10) / 10;
    const nz = (v) => (v === '' || v == null ? null : Number(v));

    // แปลข้อความไทย/อังกฤษตามการตั้งค่าภาษา
    const L = (th, en) => (set.lang === 'en' ? en : th);
    const fmt = (s, opts) => parseDate(s).toLocaleDateString(
      set.lang === 'en' ? 'en-GB' : 'th-TH',
      opts || { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }
    );

    /* ============================================================================
     * 2. SVG ICONS & REUSABLE TAILWIND CLASSES
     * ============================================================================ */
    const ICONS = {
      dash: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h14V10"/></svg>',
      cal: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',

      wo: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>',
      body: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="1"/></svg>',
      an: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>',
      pf: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>',
      set: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>',
      plus: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
      edit: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
      trash: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
      copy: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
      water: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>',
      search: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
      close: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'
    };

    const CLS = {
      card: 'bg-white dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800 rounded-2xl p-4 sm:p-5 shadow-sm',
      input: 'bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl px-3 py-2 text-sm text-zinc-900 dark:text-zinc-100 placeholder:text-zinc-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500 transition min-h-[40px]',
      btn: 'inline-flex items-center justify-center gap-1.5 px-3.5 py-2 rounded-xl text-sm font-medium border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-zinc-800 dark:text-zinc-100 hover:bg-zinc-50 dark:hover:bg-zinc-700/80 active:scale-[0.98] transition cursor-pointer min-h-[40px]',
      btnPrimary: 'inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm active:scale-[0.98] transition cursor-pointer min-h-[40px]',
      btnIcon: 'p-2 rounded-lg text-zinc-500 hover:text-zinc-900 dark:hover:text-white hover:bg-zinc-100 dark:hover:bg-zinc-800 transition cursor-pointer',
      btnDangerIcon: 'p-2 rounded-lg text-zinc-400 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition cursor-pointer'
    };

    /* ============================================================================
     * 3. STORAGE LAYER (IndexedDB 'fitlog' v1 + Fallback อัตโนมัติไป localStorage)
     * ============================================================================ */
    const STORES = ['meals', 'workouts', 'cardio', 'body', 'days', 'foods'];
    let db = null;
    let useLSFallback = false;
    const S = { meals: [], workouts: [], cardio: [], body: [], days: [], foods: [] };

    const lsKey = (s) => `fitlog.ls.${s}`;

    const openDB = () => new Promise((resolve) => {
      if (!window.indexedDB) {
        useLSFallback = true;
        return resolve(null);
      }
      try {
        const req = indexedDB.open('fitlog', 1);
        req.onupgradeneeded = () => {
          const d = req.result;
          STORES.forEach(st => {
            if (!d.objectStoreNames.contains(st)) d.createObjectStore(st, { keyPath: 'id' });
          });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => { useLSFallback = true; resolve(null); };
      } catch (e) {
        useLSFallback = true;
        resolve(null);
      }
    });

    const dbTx = (store, mode, fn) => new Promise((resolve, reject) => {
      const tx = db.transaction(store, mode);
      const req = fn(tx.objectStore(store));
      tx.oncomplete = () => resolve(req && req.result);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });

    const dbLoadAll = async () => {
      if (useLSFallback || !db) {
        STORES.forEach(st => {
          try { S[st] = JSON.parse(localStorage.getItem(lsKey(st)) || '[]'); }
          catch (e) { S[st] = []; }
        });
        return;
      }
      for (const st of STORES) {
        S[st] = (await dbTx(st, 'readonly', o => o.getAll())) || [];
      }
    };

    const dbPut = async (st, val) => {
      if (useLSFallback || !db) {
        const arr = S[st].filter(x => x.id !== val.id);
        arr.push(val);
        localStorage.setItem(lsKey(st), JSON.stringify(arr));
        return;
      }
      await dbTx(st, 'readwrite', o => o.put(val));
    };

    const dbDelete = async (st, id) => {
      if (useLSFallback || !db) {
        const arr = S[st].filter(x => x.id !== id);
        localStorage.setItem(lsKey(st), JSON.stringify(arr));
        return;
      }
      await dbTx(st, 'readwrite', o => o.delete(id));
    };

    const dbReplaceAll = async (data) => {
      if (useLSFallback || !db) {
        STORES.forEach(st => {
          localStorage.setItem(lsKey(st), JSON.stringify(Array.isArray(data[st]) ? data[st] : []));
        });
        return;
      }
      await new Promise((resolve, reject) => {
        const tx = db.transaction(STORES, 'readwrite');
        STORES.forEach(st => {
          const o = tx.objectStore(st);
          o.clear();
          (data[st] || []).forEach(r => o.put(r));
        });
        tx.oncomplete = () => resolve();
        tx.onerror = tx.onabort = () => reject(tx.error);
      });
    };

    /* ============================================================================
     * 4. SETTINGS, THEME & BUILT-IN DATASETS (ตั้งค่า ธีม อาหาร และท่าออกกำลังกาย)
     * ============================================================================ */
    const DEFAULT_SET = () => ({
      kcal: 2000, p: 120, c: 250, f: 65, water: 2000,
      ws: 1, th: 'sys', bk: 0, lang: 'th', fav: [], pf: {}, gs: 0
    });
    let set = DEFAULT_SET();
    try {
      Object.assign(set, JSON.parse(localStorage.getItem('fitlog.set') || '{}'));
      if (!Array.isArray(set.fav)) set.fav = [];
      if (!set.pf || typeof set.pf !== 'object') set.pf = {};
    } catch (e) {}

    const saveSet = () => {
      try { localStorage.setItem('fitlog.set', JSON.stringify(set)); } catch (e) {}
    };

    const sysDarkMQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    const applyTheme = () => {
      const isDark = set.th === 'dark' || (set.th === 'sys' && sysDarkMQ && sysDarkMQ.matches);
      document.documentElement.classList.toggle('dark', isDark);
      document.documentElement.lang = set.lang === 'en' ? 'en' : 'th';
    };
    if (sysDarkMQ && sysDarkMQ.addEventListener) {
      sysDarkMQ.addEventListener('change', () => { if (set.th === 'sys') applyTheme(); });
    }

    // หมวดหมู่อาหารทั้ง 7 หมวดหมู่
    const FOOD_CATS = [
      { id: 'all',     th: 'ทั้งหมด',        en: 'All',             badge: 'bg-zinc-100 text-zinc-700 dark:bg-zinc-800 dark:text-zinc-300' },
      { id: 'main',    th: 'เมนูหลัก',       en: 'Main Dish',       badge: 'bg-orange-100 text-orange-800 dark:bg-orange-950/60 dark:text-orange-300' },
      { id: 'protein', th: 'เนื้อสัตว์',     en: 'Meat & Protein',  badge: 'bg-rose-100 text-rose-800 dark:bg-rose-950/60 dark:text-rose-300' },
      { id: 'carb',    th: 'ข้าว & แป้ง',    en: 'Rice & Carbs',    badge: 'bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300' },
      { id: 'veg',     th: 'ผัก & ผลไม้',    en: 'Veg & Fruit',     badge: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300' },
      { id: 'drink',   th: 'เครื่องดื่ม & นม', en: 'Drinks & Dairy', badge: 'bg-sky-100 text-sky-800 dark:bg-sky-950/60 dark:text-sky-300' },
      { id: 'dessert', th: 'ของหวาน & ขนม',  en: 'Dessert & Snack', badge: 'bg-pink-100 text-pink-800 dark:bg-pink-950/60 dark:text-pink-300' },
      { id: 'other',   th: 'อื่นๆ',          en: 'Other',           badge: 'bg-violet-100 text-violet-800 dark:bg-violet-950/60 dark:text-violet-300' }
    ];
    const getCatObj = (id) => FOOD_CATS.find(c => c.id === id) || FOOD_CATS[FOOD_CATS.length - 1];

    // ฐานข้อมูลอาหารเริ่มต้น 46 รายการ แยกตามหมวดหมู่ (รวมอาหารต้นฉบับครบทั้ง 17 รายการ)
    // รูปแบบ: [ชื่อไทย, ชื่ออังกฤษ, หมวด, หน่วยไทย, หน่วยอังกฤษ, kcal, P, C, F]
    const FOODS = [
      // เมนูหลัก (Main Dish)
      ['ผัดกะเพราไก่ไข่ดาว (รวมข้าว)', 'Pad kra pao chicken with fried egg & rice', 'main', 'จาน', 'plate', 620, 28, 70, 25],
      ['ต้มยำกุ้ง', 'Tom yum goong', 'main', 'ถ้วย', 'bowl', 120, 12, 6, 5],
      ['ข้าวมันไก่ต้ม', 'Hainanese chicken rice', 'main', 'จาน', 'plate', 585, 25, 72, 21],
      ['ข้าวหมูแดง', 'BBQ pork rice', 'main', 'จาน', 'plate', 540, 22, 74, 16],
      ['ข้าวผัดหมู', 'Pork fried rice', 'main', 'จาน', 'plate', 560, 20, 68, 22],
      ['ก๋วยเตี๋ยวน้ำใสหมู', 'Clear pork noodle soup', 'main', 'ชาม', 'bowl', 360, 18, 48, 9],
      ['ผัดไทยกุ้งสด', 'Pad Thai with shrimp', 'main', 'จาน', 'plate', 550, 20, 68, 22],
      ['ส้มตำไทย', 'Thai papaya salad (Som Tum)', 'main', 'จาน', 'plate', 120, 3, 22, 2.5],
      ['แกงจืดเต้าหู้หมูสับ', 'Tofu & minced pork clear soup', 'main', 'ถ้วย', 'bowl', 150, 14, 6, 7],
      ['สุกี้น้ำไก่', 'Thai chicken suki soup', 'main', 'ชาม', 'bowl', 340, 26, 38, 8],
      ['ลาบไก่', 'Spicy minced chicken salad (Larb)', 'main', 'จาน', 'plate', 190, 25, 8, 6],

    /* ============================================================================

    // รองรับหน่วย 100 กรัมหลายรูปแบบทั้งไทยและอังกฤษ (100 ก., 100ก., 100 g, 100g, 100 grams)
    const isGramFood = (f) => {
      if (!f || !f.u) return false;

    };

    const UNIT_EN_MAP = {
      'ก.': 'g', 'กรัม': 'g', 'จาน': 'plate', 'ถ้วย': 'cup', 'ชาม': 'bowl',
      'ฟอง': 'egg', 'ลูก': 'piece', 'ชิ้น': 'slice', 'แผ่น': 'slice',

    };

    const storedFoodUnit = (u) => {
      if (set.lang !== 'en' || !u) return u || '';
      const exactFood = FOODS.find(f => f.u === u);
      if (exactFood && exactFood.ue) return exactFood.ue;
      if (UNIT_EN_MAP[u]) return UNIT_EN_MAP[u];
      return String(u)
        .replace(/ถ้วย/g, 'cup').replace(/จาน/g, 'plate').replace(/ชาม/g, 'bowl')
        .replace(/ฟอง/g, 'egg').replace(/ลูก/g, 'piece').replace(/ชิ้น/g, 'slice')
        .replace(/แผ่น/g, 'slice').replace(/แก้ว/g, 'glass').replace(/สกู๊ป/g, 'scoop')
        .replace(/กล่อง/g, 'box').replace(/ซองเล็ก/g, 'small bag').replace(/หน่วย/g, 'unit')
        .replace(/ครั้ง/g, 'serving').replace(/มล\./g, 'ml').replace(/กรัม/g, 'g').replace(/ก\./g, 'g');
    };

    /* ============================================================================

    // โหลดร่างเวิร์กเอาต์เดิมจาก localStorage

    // ฟังก์ชันช่วยคำนวณข้อมูลตามวัน
    const onDate = (store, d) => S[store].filter(x => x.date === d);
    const dayRec = (d) => S.days.find(x => x.id === d) || { id: d };
    const waterOf = (d) => Number(dayRec(d).water || 0);
    const totNut = (d) => {
      const t = { k: 0, p: 0, c: 0, f: 0 };
      onDate('meals', d).forEach(m => (m.items || []).forEach(i => {
        t.k += i.k || 0; t.p += i.p || 0; t.c += i.c || 0; t.f += i.f || 0;
      }));
      return t;
    };
    const mealSum = (m) => (m.items || []).reduce(

    // คำนวณแคลอรี่แนะนำด้วยสูตร Mifflin-St Jeor
    const estimateKcal = () => {
      const p = set.pf || {};
      const w = latestWeight();
      const age = p.by ? new Date().getFullYear() - p.by : 0;
      if (!(w && p.h && age > 0 && age < 120 && (p.sx === 'm' || p.sx === 'f'))) return null;
      const bmr = 10 * w.weight + 6.25 * p.h - 5 * age + (p.sx === 'm' ? 5 : -161);
      const tdee = bmr * (+p.ac || 1.2);
      const adj = p.gl === 'lose' ? -500 : p.gl === 'gain' ? 300 : 0;
      return Math.max(1200, Math.round(tdee + adj));
    };

    // คำนวณสัดส่วนสารอาหารหลัก (P/C/F) อัตโนมัติตามน้ำหนักและเป้าหมาย
    const estimateMacros = (kcal) => {
      const p = set.pf || {};
      const w = latestWeight();
      const gl = p.gl || 'keep';
      const protPerKg = gl === 'lose' ? 2.0 : gl === 'gain' ? 1.8 : 1.6;
      const rawProt = w ? Math.round(w.weight * protPerKg) : Math.round((kcal * 0.3) / 4);
      const protein = Math.min(rawProt, Math.round((kcal * 0.45) / 4));
      const fat = Math.round((kcal * 0.25) / 9);
      const carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
      return { p: protein, c: carbs, f: fat };
    };

    // ค้นหาสถิติครั้งล่าสุดของท่าออกกำลังกายที่กำลังพิมพ์ (Progressive Overload Hint)
    const findLastExercise = (exName) => {
      const key = String(exName || '').trim().toLowerCase();
      if (!key) return null;
      const sorted = [...S.workouts].sort((a, b) => b.date.localeCompare(a.date));
      for (const w of sorted) {
        const ex = (w.exercises || []).find(e => e.name.trim().toLowerCase() === key);
        if (ex && ex.sets && ex.sets.length) {
          const maxW = ex.sets.reduce((mx, st) => (st.w != null && st.w > mx ? st.w : mx), 0);
          return { date: w.date, workoutName: w.name, sets: ex.sets, maxW };
        }
      }
      return null;
    };

        error: 'bg-rose-600 text-white border-rose-500',
        info: 'bg-blue-600 text-white border-blue-500'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-lg text-sm font-medium flex items-center justify-between gap-3 animate-fade ${colors[tone] || colors.ok}`;
      el.innerHTML = `<span>${esc(text)}</span><button type="button" class="opacity-70 hover:opacity-100 cursor-pointer" aria-label="close">${ICONS.close}</button>`;

          </div>
          <div class="flex flex-wrap gap-1.5">
            <button data-a="water" data-v="${dateKey}|250" class="flex-1 py-1.5 px-2 rounded-xl text-xs font-semibold bg-sky-50 dark:bg-sky-950/50 text-sky-700 dark:text-sky-300 border border-sky-200/70 dark:border-sky-800/60 hover:bg-sky-100 dark:hover:bg-sky-900/50 cursor-pointer">+250 ${L('มล.', 'ml')}</button>
            <button data-a="water" data-v="${dateKey}|500" class="flex-1 py-1.5 px-2 rounded-xl text-xs font-semibold bg-sky-50 dark:bg-sky-950/50 text-sky-700 dark:text-sky-300 border border-sky-200/70 dark:border-sky-800/60 hover:bg-sky-100 dark:hover:bg-sky-900/50 cursor-pointer">+500 ${L('มล.', 'ml')}</button>
            ${cur > 0 ? `<button data-a="water" data-v="${dateKey}|-250" class="py-1.5 px-2.5 rounded-xl text-xs font-medium bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300 hover:bg-zinc-200 dark:hover:bg-zinc-700 cursor-pointer">-250</button>` : ''}
          </div>
        </div>`;
    };

    /* ============================================================================
     * 9. NAVIGATION RENDERER (แถบเมนู Desktop & Mobile)
     * ============================================================================ */
    const renderNav = () => {
      $('#nav-desktop').innerHTML = PAGES.map(p => `
        <button data-a="nav" data-v="${p.id}" ${p.id === page ? 'aria-current="page"' : ''}
          class="px-3 py-1.5 rounded-xl text-sm font-medium transition cursor-pointer whitespace-nowrap
          ${p.id === page
            ? 'bg-emerald-600 text-white shadow-sm font-semibold'
            : 'text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white hover:bg-zinc-100 dark:hover:bg-zinc-800'}">
          ${L(p.th, p.en)}
        </button>`).join('');

      $('#nav-actions').innerHTML = `
        <button data-a="nav" data-v="pf" aria-label="${L('โปรไฟล์', 'Profile')}"
          class="md:hidden p-2 rounded-xl transition cursor-pointer ${page === 'pf' ? 'bg-emerald-600 text-white' : 'text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800'}">
          ${ICONS.pf}
        </button>
        <button data-a="nav" data-v="set" aria-label="${L('ตั้งค่า', 'Settings')}"
          class="md:hidden p-2 rounded-xl transition cursor-pointer ${page === 'set' ? 'bg-emerald-600 text-white' : 'text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800'}">
          ${ICONS.set}
        </button>
        <button data-a="lang" aria-label="Language"
          class="px-2.5 py-1.5 rounded-xl text-xs font-bold border border-zinc-200 dark:border-zinc-700 text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition cursor-pointer">
          ${set.lang === 'en' ? 'ไทย' : 'EN'}
        </button>`;

      $('#nav-mobile').innerHTML = PAGES.filter(p => p.mobile).map(p => `
        <button data-a="nav" data-v="${p.id}" ${p.id === page ? 'aria-current="page"' : ''}
          class="flex flex-col items-center justify-center py-1 rounded-xl text-[11px] font-medium transition cursor-pointer
          ${p.id === page
            ? 'text-emerald-600 dark:text-emerald-400 font-semibold bg-emerald-50/70 dark:bg-emerald-950/40'
            : 'text-zinc-500 dark:text-zinc-400'}">
          ${ICONS[p.id]}
          <span class="mt-0.5 truncate max-w-full">${L(p.th, p.en)}</span>
        </button>`).join('');
    };

    /* ============================================================================
     * 10. PAGE RENDERERS (8 หน้าหลัก)
     * ============================================================================ */
    const P = {};

    /* --- 10.1 หน้าภาพรวม (Overview / Dashboard) --- */
    P.dash = () => {
      const T = todayStr();
      const t = totNut(T);
      const hasFood = hasNut(T);
      const wToday = onDate('workouts', T);
      const cToday = onDate('cardio', T);
      const bw = latestWeight();
      const rec = dayRec(T);

      const last7 = [...Array(7)].map((_, i) => addDays(T, -i)).filter(countNut);
      const avg7 = last7.length ? Math.round(last7.reduce((a, d) => a + totNut(d).k, 0) / last7.length) : null;
      const backupOld = !set.bk || (Date.now() - set.bk > 6048e5);

      const pctK = set.kcal > 0 ? Math.min(100, Math.round((t.k / set.kcal) * 100)) : 0;
      const ringR = 26, ringC = 2 * Math.PI * ringR;
      const ringOffset = ringC * (1 - pctK / 100);
      const remainK = Math.round(set.kcal - t.k);

      const gw = set.pf && set.pf.gw != null ? Number(set.pf.gw) : null;
      const wDiff = bw && gw ? r1(bw.weight - gw) : null;

      return `
        <div class="space-y-5 animate-fade">
          <div class="flex flex-wrap items-end justify-between gap-3">
            <div>
              <p class="text-xs font-semibold uppercase tracking-wider text-emerald-600 dark:text-emerald-400">
                ${set.pf && set.pf.name ? `${L('สวัสดี', 'Hello')} ${esc(set.pf.name)}` : L('ภาพรวมวันนี้', "Today's overview")}
              </p>
              <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-zinc-900 dark:text-white mt-0.5">${fmt(T)}</h1>
            </div>
          </div>

          ${!set.gs ? `
            <div class="rounded-2xl border border-amber-300/80 dark:border-amber-800/70 bg-amber-50/80 dark:bg-amber-950/30 p-4 flex flex-wrap items-center justify-between gap-3">
              <div>
                <p class="font-bold text-sm text-amber-950 dark:text-amber-200">${L('ใช้เป้าหมายเริ่มต้น', 'Using default goals')} (${set.kcal.toLocaleString()} kcal)</p>
                <p class="text-xs text-amber-800/90 dark:text-amber-300/80 mt-0.5">${L('ตั้งเป้าหมายของคุณเองได้ในหน้าโปรไฟล์หรือตั้งค่า', 'Set your own goals in Profile or Settings')}</p>
              </div>
              <button data-a="nav" data-v="pf" class="${CLS.btn} !py-1.5 !min-h-[36px] text-xs font-semibold">${L('ตั้งเป้าหมาย', 'Set goals')}</button>
            </div>` : ''}

          ${backupOld ? `
            <div class="rounded-2xl border border-amber-300/80 dark:border-amber-800/70 bg-amber-50/80 dark:bg-amber-950/30 p-4 flex flex-wrap items-center justify-between gap-3">
              <div>
                <p class="font-bold text-sm text-amber-950 dark:text-amber-200">${L('ถึงเวลาสำรองข้อมูล', 'Time to back up')}</p>
                <p class="text-xs text-amber-800/90 dark:text-amber-300/80 mt-0.5">
                  ${L('ข้อมูลเก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น', 'Your data is stored only in this browser')} ·
                  ${set.bk
                    ? `${L('ไฟล์สำรองล่าสุดสร้างเมื่อ', 'Last backup file created')} ${new Date(set.bk).toLocaleDateString(set.lang === 'en' ? 'en-GB' : 'th-TH')}`
                    : L('ยังไม่เคยสร้างไฟล์สำรอง', 'No backup file yet')}
                </p>
              </div>
              <button data-a="nav" data-v="set" class="${CLS.btnPrimary} !py-1.5 !min-h-[36px] text-xs">${L('ไปหน้าสำรองข้อมูล', 'Go to backup')}</button>
            </div>` : ''}

          <!-- ปุ่มลัดเพิ่มรายการด่วน -->
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
            <button data-a="qa" data-v="nut" class="${CLS.btnPrimary} !justify-start px-3.5">${ICONS.plus}<span>${L('เพิ่มอาหาร', 'Add food')}</span></button>
            <button data-a="qa" data-v="wo" class="${CLS.btn} !justify-start px-3.5">${ICONS.plus}<span>${L('เพิ่มเวิร์กเอาต์', 'Add workout')}</span></button>
            <button data-a="qa" data-v="wo:cardio" class="${CLS.btn} !justify-start px-3.5">${ICONS.plus}<span>${L('เพิ่มคาร์ดิโอ', 'Add cardio')}</span></button>
            <button data-a="qa" data-v="body" class="${CLS.btn} !justify-start px-3.5">${ICONS.plus}<span>${L('สัดส่วนร่างกาย', 'Add body')}</span></button>
          </div>

          <!-- การ์ดสรุปผล -->
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- แคลอรี่วันนี้ -->
            <div class="${CLS.card} flex flex-col justify-between">
              <div class="flex items-start justify-between gap-3">
                <div>
                  <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400">${L('แคลอรี่วันนี้', "Today's calories")}</h2>
                  ${hasFood ? `
                    <div class="text-3xl font-extrabold tabular-nums text-zinc-900 dark:text-white mt-2">
                      ${Math.round(t.k).toLocaleString()}
                      <span class="text-sm font-normal text-zinc-500">/ ${set.kcal.toLocaleString()}</span>
                    </div>
                  ` : `<p class="text-sm text-zinc-500 dark:text-zinc-400 mt-3">${L('ยังไม่ได้บันทึกอาหารวันนี้', 'No food logged today')}</p>`}
                </div>
                ${hasFood ? `
                  <div class="relative w-16 h-16 shrink-0">
                    <svg viewBox="0 0 64 64" class="w-16 h-16 -rotate-90">
                      <circle cx="32" cy="32" r="${ringR}" fill="none" stroke="currentColor" stroke-width="6" class="text-zinc-100 dark:text-zinc-800"/>
                      <circle cx="32" cy="32" r="${ringR}" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"
                        class="${t.k > set.kcal ? 'text-rose-500' : 'text-blue-500'}"
                        stroke-dasharray="${ringC.toFixed(1)}" stroke-dashoffset="${ringOffset.toFixed(1)}"/>
                    </svg>
                    <span class="absolute inset-0 flex items-center justify-center text-xs font-bold tabular-nums text-zinc-700 dark:text-zinc-200">${pctK}%</span>
                  </div>` : ''}
              </div>
              ${hasFood ? `
                <div class="mt-3 space-y-1.5">
                  ${progressBar(t.k, set.kcal, t.k > set.kcal ? 'bg-rose-500' : 'bg-blue-500')}
                  <p class="text-xs font-medium ${remainK < 0 ? 'text-rose-600 dark:text-rose-400' : 'text-zinc-500 dark:text-zinc-400'} tabular-nums">
                    ${remainK >= 0
                      ? `${L('เหลืออีก', 'Remaining')} ${remainK.toLocaleString()} kcal`
                      : `${L('เกินเป้าหมาย', 'Over goal')} ${Math.abs(remainK).toLocaleString()} kcal`}
                  </p>
                </div>` : ''}
            </div>

            <!-- สารอาหารหลัก -->
            <div class="${CLS.card}">
              <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-3">${L('สารอาหารหลัก', 'Macros')}</h2>
              ${hasFood ? `
                <div class="space-y-3">
                  ${[
                    [L('โปรตีน', 'Protein'), t.p, set.p, 'bg-emerald-500'],
                    [L('คาร์บ', 'Carbs'), t.c, set.c, 'bg-amber-500'],
                    [L('ไขมัน', 'Fat'), t.f, set.f, 'bg-rose-500']
                  ].map(([name, val, goal, col]) => `
                    <div>
                      <div class="flex justify-between text-xs mb-1">
                        <span class="font-medium text-zinc-700 dark:text-zinc-300">${name}</span>
                        <span class="tabular-nums text-zinc-600 dark:text-zinc-400"><b class="text-zinc-900 dark:text-zinc-100">${r1(val)}</b> / ${goal} ${L('ก.', 'g')}</span>
                      </div>
                      ${progressBar(val, goal, col)}
                    </div>`).join('')}
                </div>
              ` : `<p class="text-sm text-zinc-500 dark:text-zinc-400 mt-1">${L('จะแสดงเมื่อมีบันทึกอาหาร', 'Shown once you log food')}</p>`}
            </div>

            <!-- การ์ดน้ำดื่มวันนี้ -->
            ${renderWaterCard(T, false)}

            <!-- การออกกำลังกายวันนี้ -->
            <div class="${CLS.card}">
              <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-3">${L('การออกกำลังกายวันนี้', "Today's activity")}</h2>
              ${wToday.length || cToday.length ? `
                <div class="space-y-2 text-sm">
                  ${wToday.map(w => `
                    <div class="p-2.5 rounded-xl bg-emerald-50/70 dark:bg-emerald-950/30 border border-emerald-200/60 dark:border-emerald-800/40">
                      <div class="font-semibold text-zinc-900 dark:text-zinc-100">${esc(w.name)}</div>
                      <div class="text-xs text-zinc-600 dark:text-zinc-400 mt-0.5 tabular-nums">
                        ${w.exercises.length} ${L('ท่า', 'exercises')}${w.min ? ` · ${w.min} ${L('นาที', 'min')}` : ''} · ${L('วอลุ่ม', 'Volume')} ${calcVol(w).toLocaleString()} ${L('กก.', 'kg')}
                      </div>
                    </div>`).join('')}
                  ${cToday.map(c => `
                    <div class="p-2.5 rounded-xl bg-amber-50/70 dark:bg-amber-950/30 border border-amber-200/60 dark:border-amber-800/40">
                      <div class="font-semibold text-zinc-900 dark:text-zinc-100">${esc(cardioLabel(c.type))}</div>
                      <div class="text-xs text-zinc-600 dark:text-zinc-400 mt-0.5 tabular-nums">
                        ${c.km} ${L('กม.', 'km')} · ${c.min} ${L('นาที', 'min')}${c.hr ? ` · HR ${c.hr}` : ''}
                      </div>
                    </div>`).join('')}
                </div>
              ` : `<p class="text-sm text-zinc-500 dark:text-zinc-400">${rec.act === 'rest' ? L('วันนี้ตั้งเป็นวันพัก', 'Marked as a rest day') : L('ยังไม่มีบันทึก', 'No records yet')}</p>`}
            </div>

            <!-- น้ำหนักล่าสุด + เทียบเป้าหมาย -->
            <div class="${CLS.card}">
              <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-2">${L('น้ำหนักล่าสุด', 'Latest weight')}</h2>
              ${bw ? `
                <div class="text-3xl font-extrabold tabular-nums text-zinc-900 dark:text-white">
                  ${bw.weight} <span class="text-sm font-normal text-zinc-500">${L('กก.', 'kg')}</span>
                </div>
                <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-1">${fmt(bw.date, { day: 'numeric', month: 'short', year: 'numeric' })}</p>
                ${gw != null ? `
                  <div class="mt-3 pt-2.5 border-t border-zinc-100 dark:border-zinc-800 flex items-center justify-between text-xs">
                    <span class="text-zinc-500">${L('เป้าหมาย', 'Goal')}: <b class="text-zinc-800 dark:text-zinc-200 tabular-nums">${gw} ${L('กก.', 'kg')}</b></span>
                    <span class="px-2 py-0.5 rounded-full font-semibold tabular-nums ${wDiff === 0 ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300' : 'bg-violet-100 text-violet-700 dark:bg-violet-950/60 dark:text-violet-300'}">
                      ${wDiff === 0 ? L('ถึงเป้าหมายแล้ว!', 'Goal reached!') : `${wDiff > 0 ? '+' : ''}${wDiff} ${L('กก.', 'kg')}`}
                    </span>
                  </div>` : ''}
              ` : `<p class="text-sm text-zinc-500 dark:text-zinc-400">${L('ยังไม่มีข้อมูลน้ำหนัก', 'No weight data yet')}</p>`}
            </div>

            <!-- เฉลี่ย 7 วันล่าสุด -->
            <div class="${CLS.card}">
              <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-2">${L('7 วันล่าสุด', 'Last 7 days')}</h2>
              ${avg7 != null ? `
                <div class="text-3xl font-extrabold tabular-nums text-zinc-900 dark:text-white">
                  ${avg7.toLocaleString()} <span class="text-sm font-normal text-zinc-500">kcal/${L('วัน', 'day')}</span>
                </div>
                <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-1.5">
                  ${L(`เฉลี่ยเฉพาะ ${last7.length} วันที่บันทึกครบ (ไม่นับวันบันทึกบางส่วน)`, `Averaged over ${last7.length} complete logged days (excluding partial)`)}
                </p>
              ` : `<p class="text-sm text-zinc-500 dark:text-zinc-400">${L('ต้องมีบันทึกอาหารก่อนจึงจะสรุปได้', 'Log some food to see a summary')}</p>`}
            </div>
          </div>
        </div>`;
    };

    /* --- 10.2 หน้าปฏิทิน (Calendar) --- */
    P.cal = () => {
      const T = todayStr();
      const [y, m] = cm.split('-').map(Number);
      const firstDayOffset = (new Date(y, m - 1, 1).getDay() - set.ws + 7) % 7;
      const daysInMonth = new Date(y, m, 0).getDate();
      const wkHeaders = set.lang === 'en' ? ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'] : ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];

      const kinds = [
        { k: 'n', th: 'โภชนาการ', en: 'Nutrition', dot: 'bg-blue-500' },
        { k: 'w', th: 'เวิร์กเอาต์', en: 'Workout', dot: 'bg-emerald-500' },
        { k: 'c', th: 'คาร์ดิโอ', en: 'Cardio', dot: 'bg-amber-500' },
        { k: 'b', th: 'ร่างกาย', en: 'Body', dot: 'bg-violet-500' }
      ];

      let gridHtml = [...Array(7)].map((_, i) =>
        `<div class="text-center text-xs font-semibold text-zinc-400 py-1">${wkHeaders[(set.ws + i) % 7]}</div>`
      ).join('') + '<div></div>'.repeat(firstDayOffset);

      for (let d = 1; d <= daysInMonth; d++) {
        const s = `${cm}-${pad(d)}`;
        const h = hasAny(s);
        const activeKinds = kinds.filter(k => F[k.k] && h[k.k]);
        const isSel = s === D;
        const isToday = s === T;
        gridHtml += `
          <button data-a="sd" data-v="${s}" aria-label="${d} ${activeKinds.map(k => L(k.th, k.en)).join(', ') || L('ไม่มีบันทึก', 'No records')}"
            class="aspect-square min-h-[44px] rounded-xl p-1.5 flex flex-col justify-between items-start border text-sm transition cursor-pointer
            ${isSel
              ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm font-bold'
              : isToday
                ? 'bg-emerald-50/70 dark:bg-emerald-950/30 border-emerald-500 text-zinc-900 dark:text-white font-semibold'
                : 'bg-white dark:bg-zinc-900 border-zinc-200/80 dark:border-zinc-800 text-zinc-700 dark:text-zinc-200 hover:border-zinc-300 dark:hover:border-zinc-700'}">
            <span class="text-xs sm:text-sm leading-none tabular-nums">${d}</span>
            <span class="flex gap-1 flex-wrap">
              ${activeKinds.map(k => `<span class="w-1.5 h-1.5 rounded-full ${isSel ? 'bg-white' : k.dot}"></span>`).join('')}
            </span>
          </button>`;
      }

      // รายละเอียดของวันที่เลือก
      const ms = onDate('meals', D);
      const ws = onDate('workouts', D);
      const cs = onDate('cardio', D);
      const bs = onDate('body', D);
      const t = totNut(D);
      const r = dayRec(D);
      const wMl = waterOf(D);

      const wkStartOffset = (parseDate(D).getDay() - set.ws + 7) % 7;
      const wkDays = [...Array(7)].map((_, i) => addDays(D, i - wkStartOffset));
      const wkWorkDays = wkDays.filter(d => onDate('workouts', d).length).length;
      const wkCardio = wkDays.flatMap(d => onDate('cardio', d));
      const wkNutDays = wkDays.filter(countNut);

      return `
        <div class="space-y-5 animate-fade">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <h1 class="text-2xl font-bold tracking-tight text-zinc-900 dark:text-white">
              ${parseDate(`${cm}-01`).toLocaleDateString(set.lang === 'en' ? 'en-GB' : 'th-TH', { month: 'long', year: 'numeric' })}
            </h1>
            <div class="flex items-center gap-1.5">
              <button data-a="mm" data-v="-1" aria-label="${L('เดือนก่อน', 'Previous month')}" class="${CLS.btn} !px-3">‹</button>
              <button data-a="today" class="${CLS.btn} !px-3.5 text-xs font-semibold">${L('วันนี้', 'Today')}</button>
              <button data-a="mm" data-v="1" aria-label="${L('เดือนถัดไป', 'Next month')}" class="${CLS.btn} !px-3">›</button>
            </div>
          </div>

          <!-- ตัวกรองจุดสี -->
          <div class="flex flex-wrap gap-2">
            ${kinds.map(k => `
              <label class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium border cursor-pointer select-none transition
                ${F[k.k]
                  ? 'bg-white dark:bg-zinc-900 border-zinc-300 dark:border-zinc-700 text-zinc-800 dark:text-zinc-100 shadow-sm'
                  : 'bg-zinc-100/70 dark:bg-zinc-900/40 border-transparent text-zinc-400'}">
                <input type="checkbox" data-c="flt" data-v="${k.k}" ${F[k.k] ? 'checked' : ''} class="sr-only">
                <span class="w-2.5 h-2.5 rounded-full ${k.dot}"></span>
                <span>${L(k.th, k.en)}</span>
              </label>`).join('')}
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
            <!-- กริดปฏิทิน -->
            <div class="${CLS.card} lg:col-span-6">
              <div class="grid grid-cols-7 gap-1.5">${gridHtml}</div>
            </div>

            <!-- รายละเอียดของวันที่เลือก -->

        [...S.meals].sort((a, b) => b.date.localeCompare(a.date)).flatMap(m => m.items.map(i => i.n))
      )];

      if (q) {
        list = catFiltered.filter(x =>
          `${x.f.n} ${x.f.e || ''} ${getCatObj(x.f.cat).th} ${getCatObj(x.f.cat).en}`.toLowerCase().includes(q)
        );

        const favs = set.fav || [];
        const priorityNames = [...new Set([...favs, ...recentNames])];
        const top = priorityNames.map(n => catFiltered.find(x => x.f.n === n)).filter(Boolean);

        list = [...top, ...rest];

            </div>
          </div>

          <!-- บันทึกของวันที่เลือก -->
          <div class="${CLS.card} space-y-3">
            <h2 class="text-base font-bold text-zinc-900 dark:text-white">${L('บันทึกของวันที่เลือก', 'Records for selected date')}</h2>
            ${dayW.length || dayC.length ? `
              <div class="divide-y divide-zinc-100 dark:divide-zinc-800">
                ${dayW.map(w => `
                  <div class="flex items-center justify-between gap-3 py-3 first:pt-0 last:pb-0">
                    <div class="min-w-0">
                      <div class="font-semibold text-sm text-zinc-900 dark:text-white">${esc(w.name)}</div>
                      <div class="text-xs text-zinc-500 dark:text-zinc-400 tabular-nums mt-0.5">
                        ${w.exercises.length} ${L('ท่า', 'exercises')}${w.min ? ` · ${w.min} ${L('นาที', 'min')}` : ''} · ${L('วอลุ่ม', 'Volume')} ${calcVol(w).toLocaleString()} ${L('กก.', 'kg')}
                      </div>
                    </div>
                    ${actionBtns('workouts', w.id)}
                  </div>`).join('')}
                ${dayC.map(c => `
                  <div class="flex items-center justify-between gap-3 py-3 first:pt-0 last:pb-0">
                    <div class="min-w-0">
                      <div class="font-semibold text-sm text-zinc-900 dark:text-white">${esc(cardioLabel(c.type))}</div>
                      <div class="text-xs text-zinc-500 dark:text-zinc-400 tabular-nums mt-0.5">
                        ${c.km} ${L('กม.', 'km')} · ${c.min} ${L('นาที', 'min')} (${c.km ? r1(c.min / c.km) : '-'} ${L('นาที/กม.', 'min/km')})${c.hr ? ` · HR ${c.hr}` : ''}
                      </div>
                    </div>
                    ${actionBtns('cardio', c.id)}
                  </div>`).join('')}
              </div>
            ` : `<p class="text-sm text-zinc-500 text-center py-4">${L('ยังไม่มีบันทึกในวันนี้', 'No records for this day')}</p>`}
          </div>
        </div>`;
    };

    /* --- 10.5 หน้าร่างกาย (Body) --- */
    P.body = () => {
      const history = [...S.body].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 15);
      return `
        <div class="space-y-5 animate-fade">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <h1 class="text-2xl font-bold tracking-tight text-zinc-900 dark:text-white">${L('ร่างกาย', 'Body')}</h1>
            ${datePickerBar()}
          </div>

          <div class="${CLS.card} space-y-3">
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 items-end">
              <label class="block">
                <span class="text-xs font-medium text-zinc-500 dark:text-zinc-400 block mb-1">${L('น้ำหนัก (กก.)', 'Weight (kg)')}</span>
                <input id="bw" type="number" step="any" min="0" placeholder="65.5" class="${CLS.input} !w-full tabular-nums">
              </label>
              <label class="block">
                <span class="text-xs font-medium text-zinc-500 dark:text-zinc-400 block mb-1">${L('ไขมันในร่างกาย (%)', 'Body fat (%)')}</span>
                <input id="bf" type="number" step="any" min="0" max="100" placeholder="18.0" class="${CLS.input} !w-full tabular-nums">
              </label>
              <label class="block">
                <span class="text-xs font-medium text-zinc-500 dark:text-zinc-400 block mb-1">${L('รอบเอว (ซม.)', 'Waist (cm)')}</span>
                <input id="bs" type="number" step="any" min="0" placeholder="80.0" class="${CLS.input} !w-full tabular-nums">
              </label>
              <button data-a="saveb" class="${CLS.btnPrimary} w-full">${L('บันทึก', 'Save')}</button>
            </div>
            <p class="text-xs text-zinc-500 dark:text-zinc-400">${L('ช่องที่เว้นว่างจะไม่ถูกนับเป็นศูนย์', 'Blank fields are not counted as zero')}</p>
          </div>

          <div class="${CLS.card} space-y-3">
            <h2 class="text-base font-bold text-zinc-900 dark:text-white">${L('ประวัติล่าสุด', 'Recent history')}</h2>
            ${history.length ? `
              <div class="divide-y divide-zinc-100 dark:divide-zinc-800">
                ${history.map(b => `
                  <div class="flex items-center justify-between gap-3 py-2.5 first:pt-0 last:pb-0 text-sm">
                    <div class="tabular-nums">
                      <span class="font-semibold text-zinc-900 dark:text-white">${fmt(b.date, { day: 'numeric', month: 'short', year: 'numeric' })}</span>
                      <span class="text-zinc-500 dark:text-zinc-400 ml-2">
                        ${b.weight ?? '-'} ${L('กก.', 'kg')} · ${L('ไขมัน', 'Fat')} ${b.fat ?? '-'}% · ${L('เอว', 'Waist')} ${b.waist ?? '-'} ${L('ซม.', 'cm')}
                      </span>
                    </div>
                    ${actionBtns('body', b.id)}
                  </div>`).join('')}
              </div>
            ` : `<p class="text-sm text-zinc-500 text-center py-6">${L('ยังไม่มีข้อมูล', 'No data yet')}</p>`}
          </div>
        </div>`;
    };

    /* --- 10.6 หน้าวิเคราะห์ (Analytics) --- */
    P.an = () => {
      const T = todayStr();
      const hasCustom = !!(cu && (cu.a || cu.b));
      const badCustom = !!(cu && cu.a && cu.b && cu.a > cu.b);
      const ok = !!(cu && cu.a && cu.b && cu.a <= cu.b);
      const n = ok ? Math.min(366, Math.round((parseDate(cu.b) - parseDate(cu.a)) / 864e5) + 1) : rg;
      const end = ok ? cu.b : T;
      const ds = [...Array(n)].map((_, i) => addDays(end, i + 1 - n));
      const start = ds[0];
      const inRange = (d) => d >= start && d <= end;

      const completeDays = ds.filter(countNut);
      const nutTotals = completeDays.map(d => totNut(d));
      const avgK = completeDays.length ? Math.round(nutTotals.reduce((a, x) => a + x.k, 0) / completeDays.length) : null;
      const avgP = completeDays.length ? r1(nutTotals.reduce((a, x) => a + x.p, 0) / completeDays.length) : null;
      const avgC = completeDays.length ? r1(nutTotals.reduce((a, x) => a + x.c, 0) / completeDays.length) : null;
      const avgF = completeDays.length ? r1(nutTotals.reduce((a, x) => a + x.f, 0) / completeDays.length) : null;

      const allLoggedKs = ds.filter(hasNut).map(d => totNut(d).k);
      const wk = S.workouts.filter(w => inRange(w.date));
      const wkTotalMin = wk.reduce((a, w) => a + (w.min || 0), 0);
      const cd = S.cardio.filter(c => inRange(c.date));

      const BODY_METRICS = {
        weight: { th: 'น้ำหนัก (กก.)', en: 'Weight (kg)', unit: L('กก.', 'kg'), stroke: 'text-violet-500 dark:text-violet-400', fill: 'fill-violet-600 dark:fill-violet-400', tip: 'text-violet-600 dark:text-violet-400' },
        fat:    { th: 'ไขมัน (%)',     en: 'Body fat (%)', unit: '%',            stroke: 'text-amber-500 dark:text-amber-400',   fill: 'fill-amber-500 dark:fill-amber-400',   tip: 'text-amber-600 dark:text-amber-400' },
        waist:  { th: 'รอบเอว (ซม.)',  en: 'Waist (cm)',   unit: L('ซม.', 'cm'), stroke: 'text-teal-500 dark:text-teal-400',     fill: 'fill-teal-600 dark:fill-teal-400',     tip: 'text-teal-600 dark:text-teal-400' }
      };
      const bm = BODY_METRICS[anBodyMetric] || BODY_METRICS.weight;
      const bodySeries = S.body
        .filter(b => b[anBodyMetric] != null && inRange(b.date))
        .sort((x, y) => x.date.localeCompare(y.date));

      // กราฟ SVG แคลอรี่รายวัน (maxK นับรวมวันบันทึกบางส่วนไม่ให้ล้นกรอบ + จำกัดความกว้างแท่งสูงสุด)
      const W = 640, H = 160, padY = 18;
      const u = W / n;
      const maxK = Math.max(set.kcal, ...allLoggedKs, 1);
      const goalY = H - (set.kcal / maxK) * (H - padY);
      const barWidth = Math.min(36, Math.max(3, u - 2));

      const barsSvg = ds.map((d, i) => {
        if (!hasNut(d)) return '';
        const k = totNut(d).k;
        const h = Math.max(3, (k / maxK) * (H - padY));
        const isPartial = dayRec(d).nut === 'partial';
        const bx = i * u + (u - barWidth) / 2;
        return `<rect x="${bx.toFixed(1)}" y="${(H - h).toFixed(1)}" width="${barWidth.toFixed(1)}" height="${h.toFixed(1)}" rx="3"
          data-a="tipk" data-v="${d}|${Math.round(k)}|${isPartial ? 1 : 0}"
          class="cursor-pointer ${isPartial ? 'fill-blue-300 dark:fill-blue-800' : 'fill-blue-500 dark:fill-blue-400'} hover:opacity-80 transition-opacity">
          <title>${d}: ${Math.round(k)} kcal${isPartial ? L(' (บางส่วน)', ' (partial)') : ''}</title>
        </rect>`;
      }).join('') + `
        <line x1="0" x2="${W}" y1="${goalY.toFixed(1)}" y2="${goalY.toFixed(1)}" stroke="currentColor" class="text-zinc-400 dark:text-zinc-500 pointer-events-none" stroke-width="1.5" stroke-dasharray="5 5"/>
        <text x="${W - 4}" y="${Math.max(12, goalY - 5).toFixed(1)}" text-anchor="end" class="fill-zinc-500 dark:fill-zinc-400 text-[11px] font-medium pointer-events-none">${set.kcal} kcal</text>`;

      // กราฟ SVG สัดส่วนร่างกาย (จัดกึ่งกลางเมื่อมีค่าเดียวหรือค่าเท่ากัน)
      const bVals = bodySeries.map(b => b[anBodyMetric]);
      const minB = bVals.length ? Math.min(...bVals) : 0;
      const maxB = bVals.length ? Math.max(...bVals) : 0;
      const xy = (b) => {
        const val = b[anBodyMetric];
        const x = (ds.indexOf(b.date) + 0.5) * u;
        const y = maxB === minB ? H / 2 : H - 18 - ((val - minB) / (maxB - minB)) * (H - 36);
        return [x, y];
      };
      const lineSvg = (bodySeries.length > 1
        ? `<polyline points="${bodySeries.map(b => xy(b).map(v => v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="currentColor" class="${bm.stroke}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`
        : '') + bodySeries.map(b => {
          const [cx, cy] = xy(b);
          const val = b[anBodyMetric];
          return `
            <g data-a="tipw" data-v="${b.date}|${val}|${bm.unit}" class="cursor-pointer">
              <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="12" fill="transparent"/>
              <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="4.5" class="${bm.fill} stroke-white dark:stroke-zinc-900" stroke-width="2">
                <title>${b.date}: ${val} ${bm.unit}</title>
              </circle>
            </g>`;
        }).join('');

      const rangeCaption = `${fmt(start, { day: 'numeric', month: 'short' })} – ${ok ? fmt(end, { day: 'numeric', month: 'short' }) : L('วันนี้', 'Today')}`;

      return `
        <div class="space-y-5 animate-fade">
          <h1 class="text-2xl font-bold tracking-tight text-zinc-900 dark:text-white">${L('วิเคราะห์', 'Analytics')}</h1>

          <!-- เลือกช่วงเวลา -->
          <div class="flex flex-wrap items-center gap-2">
            ${[7, 30, 90].map(d => `
              <button data-a="rg" data-v="${d}" class="${d === rg && !ok ? CLS.btnPrimary : CLS.btn} !py-1.5 !min-h-[38px]">
                ${d} ${L('วัน', 'days')}
              </button>`).join('')}
            <div class="flex flex-wrap items-center gap-2 sm:ml-auto">
              <label class="flex items-center gap-1.5 text-xs text-zinc-500">
                <span>${L('จาก', 'From')}</span>
                <input type="date" data-c="cua" value="${cu && cu.a ? cu.a : ''}" class="${CLS.input} !py-1.5 !min-h-[38px]">
              </label>
              <label class="flex items-center gap-1.5 text-xs text-zinc-500">
                <span>${L('ถึง', 'To')}</span>
                <input type="date" data-c="cub" value="${cu && cu.b ? cu.b : ''}" class="${CLS.input} !py-1.5 !min-h-[38px]">
              </label>
              ${hasCustom ? `<button data-a="clrcu" class="${CLS.btn} !py-1.5 !px-3 !min-h-[38px] text-xs">${L('ล้างช่วงวันที่', 'Clear')}</button>` : ''}
            </div>
          </div>

          ${badCustom ? `
            <div class="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-800/60 text-xs font-medium text-rose-700 dark:text-rose-300">
              ${L('วันที่เริ่มต้นต้องไม่มากกว่าวันที่สิ้นสุด (กำลังแสดงข้อมูลช่วงมาตรฐานแทน)', 'Start date must not be after end date (showing preset range instead).')}
            </div>` : ''}

          <!-- การ์ดสรุป 3 ช่อง -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="${CLS.card}">
              <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-2">${L('แคลอรี่ & มาโครเฉลี่ย', 'Avg calories & macros')}</h2>
              ${avgK != null ? `
                <div class="text-3xl font-extrabold tabular-nums text-zinc-900 dark:text-white">${avgK.toLocaleString()} <span class="text-sm font-normal text-zinc-500">kcal/${L('วัน', 'd')}</span></div>
                <div class="flex flex-wrap gap-2 mt-2 text-xs font-semibold tabular-nums">
                  <span class="px-2 py-0.5 rounded-md bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300">P ${avgP}${L('ก.', 'g')}</span>
                  <span class="px-2 py-0.5 rounded-md bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300">C ${avgC}${L('ก.', 'g')}</span>
                  <span class="px-2 py-0.5 rounded-md bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-300">F ${avgF}${L('ก.', 'g')}</span>
                </div>
                <p class="text-xs text-zinc-500 mt-2">${L(`จาก ${completeDays.length} วันที่บันทึกครบ (วันไม่ได้บันทึกไม่นับเป็นศูนย์)`, `From ${completeDays.length} complete days (unlogged days excluded)`)}</p>
              ` : `<p class="text-sm text-zinc-500">${L('ยังไม่มีบันทึกอาหารในช่วงนี้', 'No food logs in this period')}</p>`}
            </div>

            <div class="${CLS.card}">
              <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-2">${L('เวิร์กเอาต์', 'Workout')}</h2>
              <div class="text-3xl font-extrabold tabular-nums text-zinc-900 dark:text-white">${wk.length} <span class="text-sm font-normal text-zinc-500">${L('ครั้ง', 'sessions')}</span></div>
              <p class="text-xs text-zinc-500 mt-1.5 tabular-nums">${L('วอลุ่มรวม', 'Total volume')} ${wk.reduce((a, w) => a + calcVol(w), 0).toLocaleString()} ${L('กก.', 'kg')}${wkTotalMin > 0 ? ` · ${wkTotalMin} ${L('นาที', 'min')}` : ''}</p>
            </div>

            <div class="${CLS.card}">
              <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-2">${L('คาร์ดิโอ', 'Cardio')}</h2>
              <div class="text-3xl font-extrabold tabular-nums text-zinc-900 dark:text-white">${r1(cd.reduce((a, c) => a + c.km, 0))} <span class="text-sm font-normal text-zinc-500">${L('กม.', 'km')}</span></div>
              <p class="text-xs text-zinc-500 mt-1.5 tabular-nums">${cd.reduce((a, c) => a + c.min, 0)} ${L('นาที', 'min')} · ${cd.length} ${L('ครั้ง', 'sessions')}</p>
            </div>
          </div>

          <!-- กราฟแคลอรี่รายวัน -->
          <div class="${CLS.card} space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <h2 class="text-base font-bold text-zinc-900 dark:text-white">${L('แคลอรี่รายวัน (kcal)', 'Daily calories (kcal)')}</h2>
              <span id="chart-tip-k" class="text-xs font-medium text-blue-600 dark:text-blue-400 tabular-nums">${rangeCaption}</span>
            </div>
            ${ds.some(hasNut) ? `
              <div class="w-full overflow-hidden">
                <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('กราฟแคลอรี่รายวัน', 'Daily calories chart')}" class="w-full h-auto overflow-visible">${barsSvg}</svg>
              </div>
              <div class="flex flex-wrap items-center gap-x-4 gap-y-1.5 text-xs text-zinc-500 dark:text-zinc-400">
                <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-blue-500 dark:bg-blue-400"></span>${L('บันทึกครบ', 'Complete')}</span>
                <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-blue-300 dark:bg-blue-800"></span>${L('บันทึกบางส่วน', 'Partial')}</span>
                <span class="inline-flex items-center gap-1.5"><span class="w-4 border-t-2 border-dashed border-zinc-400"></span>${L('เป้าหมาย', 'Goal')} (${set.kcal} kcal)</span>
                <span>· ${L('แตะแท่งกราฟเพื่อดูตัวเลข', 'Tap a bar for details')}</span>
              </div>
            ` : `<p class="text-sm text-zinc-500 py-8 text-center">${L('ยังไม่มีข้อมูล', 'No data yet')}</p>`}
          </div>

          <!-- กราฟสัดส่วนร่างกายแบบสลับได้ -->
          <div class="${CLS.card} space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex flex-wrap items-center gap-1.5">
                ${Object.entries(BODY_METRICS).map(([key, m]) => `
                  <button data-a="anbm" data-v="${key}" class="px-3 py-1 rounded-full text-xs font-semibold border transition cursor-pointer
                    ${anBodyMetric === key
                      ? 'bg-zinc-900 dark:bg-white text-white dark:text-zinc-950 border-zinc-900 dark:border-white'
                      : 'bg-zinc-50 dark:bg-zinc-950/70 text-zinc-600 dark:text-zinc-300 border-zinc-200 dark:border-zinc-800 hover:border-zinc-400'}">
                    ${L(m.th, m.en)}
                  </button>`).join('')}
              </div>
              <span id="chart-tip-w" class="text-xs font-medium ${bm.tip} tabular-nums">${rangeCaption}</span>
            </div>
            ${bodySeries.length ? `
              <div class="w-full overflow-hidden">
                <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L(bm.th, bm.en)}" class="w-full h-auto overflow-visible">${lineSvg}</svg>
              </div>
              <div class="flex flex-wrap gap-4 text-xs text-zinc-500 dark:text-zinc-400 tabular-nums">
                <span>${L('แตะจุดเพื่อดูวันที่', 'Tap a dot for date')}</span>
                <span>${L('ต่ำสุด', 'Min')}: <b class="text-zinc-900 dark:text-zinc-100">${minB}</b> ${bm.unit}</span>
                <span>${L('สูงสุด', 'Max')}: <b class="text-zinc-900 dark:text-zinc-100">${maxB}</b> ${bm.unit}</span>
                <span>${L('ล่าสุด', 'Latest')}: <b class="text-zinc-900 dark:text-zinc-100">${bVals[bVals.length - 1]}</b> ${bm.unit}</span>
              </div>
            ` : `<p class="text-sm text-zinc-500 py-8 text-center">${L('ยังไม่มีข้อมูลในช่วงนี้', 'No data in this period')}</p>`}
          </div>
        </div>`;
    };

    /* --- 10.7 หน้าโปรไฟล์ (Profile) --- */
    P.pf = () => {
      const p = set.pf || {};
      const w = latestWeight();
      const bmi = w && p.h ? r1(w.weight / Math.pow(p.h / 100, 2)) : null;
      const estK = estimateKcal();
      const estM = estK ? estimateMacros(estK) : null;

      return `
        <div class="space-y-5 animate-fade">
          <h1 class="text-2xl font-bold tracking-tight text-zinc-900 dark:text-white">${L('โปรไฟล์', 'Profile')}</h1>

          <div class="${CLS.card} space-y-4">
            <div>
              <h2 class="text-base font-bold text-zinc-900 dark:text-white">${L('ข้อมูลส่วนตัว', 'Personal info')}</h2>
              <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-0.5">${L('เก็บไว้ในเครื่องนี้เท่านั้น ไม่ต้องกรอกทุกช่อง (หากกรอกปีเกิด พ.ศ. ระบบจะแปลงเป็น ค.ศ. ให้)', 'Stored on this device only. All fields are optional.')}</p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              <label class="block">
                <span class="text-xs font-medium text-zinc-500 dark:text-zinc-400 block mb-1">${L('ชื่อเล่น', 'Nickname')}</span>
                <input id="pn" value="${esc(p.name || '')}" class="${CLS.input} !w-full">
              </label>
              <label class="block">
                <span class="text-xs font-medium text-zinc-500 dark:text-zinc-400 block mb-1">${L('ปีเกิด (ค.ศ.)', 'Birth year (CE)')}</span>
                <input id="pby" type="number" value="${p.by ?? ''}" placeholder="1998" class="${CLS.input} !w-full tabular-nums">
              </label>
              <label class="block">
                <span class="text-xs font-medium text-zinc-500 dark:text-zinc-400 block mb-1">${L('เพศ', 'Sex')}</span>
                <select id="psx" class="${CLS.input} !w-full">
