      try {
        await fn();
        await dbLoadAll();
        if (successMsg) showToast(successMsg, 'ok');
      } catch (err) {
        showToast(L('บันทึกไม่สำเร็จ (พื้นที่เก็บข้อมูลอาจเต็ม หรือเบราว์เซอร์บล็อก)', 'Could not save (storage may be full or blocked)'), 'error');
      } finally {
        busy = false;
        render();
      }
    };

    /* ============================================================================
     * 13. ACTIONS HANDLER (คำสั่งจากการกดปุ่มทั้งหมด)
     * ============================================================================ */
    const A = {
      nav: (v) => { page = v; ed = null; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
      qa: (v) => {
        const [targetPage, sub] = v.split(':');
        if (page === 'dash') {
          const T = todayStr();
          D = T; cm = T.slice(0, 7);
        }
        page = targetPage;
        ed = null;
        render();
        if (sub === 'cardio') {
          setTimeout(() => {
            const card = $('#cardio-card');
            if (card) {
              card.scrollIntoView({ behavior: 'smooth', block: 'center' });
              card.classList.add('highlight-pulse');
              setTimeout(() => card.classList.remove('highlight-pulse'), 1800);
            }
          }, 60);
        } else {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      },

      sd: (v) => { D = v; render(); },
      stepd: (v) => { D = addDays(D, +v); cm = D.slice(0, 7); render(); },
      today: () => { const T = todayStr(); D = T; cm = T.slice(0, 7); render(); },
      mm: (v) => {
        const d = parseDate(`${cm}-01`);
        d.setMonth(d.getMonth() + +v);
        cm = ymd(d).slice(0, 7);
        render();
      },

      yes: () => { const p = pend; pend = null; p ? p.f() : render(); },
      no: () => { pend = null; renderModals(); },
      edno: () => { ed = null; renderModals(); },
      modalbg: (_v, e) => {
        if (e.target === e.currentTarget) { pend = null; ed = null; renderModals(); }
      },

      // น้ำดื่ม
      water: (v) => {
        const [dateKey, delta] = v.split('|');
        const cur = waterOf(dateKey);
        const next = delta === 'reset' ? 0 : Math.max(0, cur + Number(delta));
        safeRun(() => dbPut('days', { ...dayRec(dateKey), water: next }));
      },

      // ค้นหาและเลือกอาหาร
      fcat: (v) => { fcat = v; render(); },
      clrfs: () => { fs = ''; render(); $('#fsr')?.focus(); },
      pick: (v) => {
        fsel = allFoods()[+v] || null;
        const pickEl = $('#pick');
        const resEl = $('#res');
        if (pickEl) pickEl.innerHTML = renderFoodPicker();
        if (resEl) resEl.innerHTML = renderFoodResults();
      },
      setfq: (v) => {
        const inp = $('#fq');
        if (inp) { inp.value = v; updateFoodPreview(); }
      },
      fav: () => {
        if (!fsel) return;
        const favs = set.fav || (set.fav = []);
        const idx = favs.indexOf(fsel.n);
        idx < 0 ? favs.push(fsel.n) : favs.splice(idx, 1);
        saveSet();
        if ($('#pick')) $('#pick').innerHTML = renderFoodPicker();
        if ($('#res')) $('#res').innerHTML = renderFoodResults();
      },

      addfood: () => {
        const q = +($('#fq')?.value || 0);
        if (!(q > 0)) return showToast(L('ใส่จำนวนมากกว่า 0', 'Enter a number above 0'), 'error');
        const selMeal = $('#ft')?.value;
        if (selMeal) lastMealType = selMeal;
        const type = ($('#ftc')?.value || '').trim() || lastMealType || 'มื้อเช้า';
        safeRun(async () => {
          const m = S.meals.find(x => x.date === D && x.type === type) || { id: uid(), date: D, type, items: [] };
          const mul = isGramFood(fsel) ? q / 100 : q;
          m.items.push({
            id: uid(),
            n: fsel.n,
            u: isGramFood(fsel) ? 'ก.' : fsel.u,
            q,
            k: fsel.k * mul,
            p: fsel.p * mul,
            c: fsel.c * mul,
            f: fsel.f * mul
          });
          await dbPut('meals', m);
        }, L('เพิ่มอาหารแล้ว', 'Added'));
      },

      quickadd: () => {
        const k = nz($('#qk')?.value);
        const p = +($('#qp')?.value || 0);
        const c = +($('#qc')?.value || 0);
        const f = +($('#qf')?.value || 0);
        if (!(k > 0)) return showToast(L('กรุณาใส่แคลอรี่มากกว่า 0', 'Enter calories above 0'), 'error');
        if (p < 0 || c < 0 || f < 0) return showToast(L('ค่าสารอาหารต้องไม่ติดลบ', 'Macros cannot be negative'), 'error');
        const selMeal = $('#qft')?.value;
        if (selMeal) lastMealType = selMeal;
        const type = lastMealType || 'ของว่าง';
        const label = ($('#qn')?.value || '').trim() || L('เพิ่มแคลอรี่ด่วน', 'Quick add');
        safeRun(async () => {
          const m = S.meals.find(x => x.date === D && x.type === type) || { id: uid(), date: D, type, items: [] };
          m.items.push({ id: uid(), n: label, u: L('ครั้ง', 'serving'), q: 1, k, p, c, f });
          await dbPut('meals', m);
        }, L('เพิ่มแคลอรี่ด่วนแล้ว', 'Quick calories added'));
      },

      copymeals: () => {
        const srcDate = $('#copy-meal-date')?.value;
        if (!srcDate) return;
        const srcMeals = onDate('meals', srcDate);
        if (!srcMeals.length) return;
        safeRun(async () => {
          for (const sm of srcMeals) {
            const target = S.meals.find(x => x.date === D && x.type === sm.type) || { id: uid(), date: D, type: sm.type, items: [] };
            sm.items.forEach(item => target.items.push({ ...item, id: uid() }));
            await dbPut('meals', target);
          }
        }, L('คัดลอกมื้ออาหารมาวันที่เลือกแล้ว', 'Meals copied to selected date'));
      },

      newfood: () => {
        const n = ($('#cn')?.value || '').trim();
        const k = nz($('#ck')?.value);
        const p = +($('#cp')?.value || 0);
        const c = +($('#cc')?.value || 0);
        const f = +($('#cf')?.value || 0);
        if (!n || k == null || k < 0) return showToast(L('ใส่ชื่อและแคลอรี่ (ต้องไม่ติดลบ)', 'Enter a name and non-negative calories'), 'error');
        if (p < 0 || c < 0 || f < 0) return showToast(L('ค่าสารอาหารต้องไม่ติดลบ', 'Macros cannot be negative'), 'error');
        const cat = $('#ccat')?.value || 'other';
        const u = ($('#cu')?.value || '').trim() || L('หน่วย', 'unit');
        safeRun(() => dbPut('foods', { id: uid(), n, cat, u, k, p, c, f }), L('บันทึกอาหารส่วนตัวแล้ว', 'Food saved'));
      },

      // เวิร์กเอาต์และคาร์ดิโอ
      addset: () => {
        const name = ($('#en')?.value || '').trim();
        const reps = +($('#er')?.value || 0);
        const w = nz($('#ew')?.value);
        const rpe = nz($('#erpe')?.value);
        const done = !!$('#edone')?.checked;
        if (!name || !(reps > 0)) return showToast(L('ใส่ชื่อท่าและจำนวนครั้งมากกว่า 0', 'Enter an exercise and reps > 0'), 'error');
        if (w != null && w < 0) return showToast(L('น้ำหนักต้องไม่ติดลบ', 'Weight cannot be negative'), 'error');
        if (rpe != null && (rpe < 1 || rpe > 10)) return showToast(L('RPE ต้องอยู่ระหว่าง 1–10', 'RPE must be 1–10'), 'error');

        let ex = draft.find(x => x.name === name);
        if (!ex) { ex = { name, sets: [] }; draft.push(ex); }
        ex.sets.push({ reps, w, rpe, done });
        lastEx = { name, reps: String(reps), w: w != null ? String(w) : '', rpe: rpe != null ? String(rpe) : '', done };
        render();
      },

      loadw: () => {
        const wid = $('#copy-wo-src')?.value;
        const src = S.workouts.find(w => w.id === wid);
        if (!src) return;
        const applyRoutine = () => {
          draft = JSON.parse(JSON.stringify(src.exercises));
          draft.name = src.name;
          draft.min = src.min != null ? String(src.min) : '';
          showToast(L('โหลดรูทีนลงร่างแล้ว ปรับแก้ก่อนบันทึกได้', 'Routine loaded into draft'), 'info');
          render();
        };
        if (draft.length > 0) {
          pend = {
            t: L(`คุณมีเซ็ตค้างอยู่ในร่างอยู่แล้ว ต้องการแทนที่ด้วยรูทีน "${src.name}" หรือไม่?`, `You already have sets in your draft. Replace with "${src.name}"?`),
            f: applyRoutine
          };
          renderModals();
        } else {
          applyRoutine();
        }
      },

      rmset: (v) => {
        const [ei, si] = v.split('|').map(Number);
        if (draft[ei]) {
          draft[ei].sets.splice(si, 1);
          if (!draft[ei].sets.length) draft.splice(ei, 1);
        }
        render();
      },

      clr: () => {
        draft = [];
        draft.name = '';
        draft.min = '';
        lastEx = { name: '', reps: '', w: '', rpe: '', done: true };
        render();
      },

      savew: () => {
        if (!draft.length) return showToast(L('เพิ่มอย่างน้อยหนึ่งเซ็ตก่อน', 'Add at least one set first'), 'error');
        const durVal = nz($('#wdur')?.value);
        if (durVal != null && durVal < 0) return showToast(L('ระยะเวลาต้องไม่ติดลบ', 'Duration cannot be negative'), 'error');
        const workout = {
          id: uid(),
          date: D,
          name: ($('#wn')?.value || '').trim() || L('เวิร์กเอาต์', 'Workout'),
          min: durVal,
          exercises: JSON.parse(JSON.stringify(draft))
        };
        draft = [];
        draft.name = '';
        draft.min = '';
        lastEx = { name: '', reps: '', w: '', rpe: '', done: true };
        safeRun(() => dbPut('workouts', workout), L('บันทึกเวิร์กเอาต์แล้ว', 'Saved'));
      },

      savec: () => {
        const km = +($('#cd')?.value || 0);
        const min = +($('#cm')?.value || 0);
        const hr = nz($('#chr')?.value);
        if (!(km > 0) || !(min > 0)) return showToast(L('ใส่ระยะทางและเวลามากกว่า 0', 'Enter distance and time above 0'), 'error');
        if (hr != null && hr < 0) return showToast(L('ค่า HR ต้องไม่ติดลบ', 'HR cannot be negative'), 'error');
        safeRun(() => dbPut('cardio', { id: uid(), date: D, type: $('#cy').value, km, min, hr }), L('บันทึกคาร์ดิโอแล้ว', 'Saved'));
      },

      saveb: () => {
        const weight = nz($('#bw')?.value);
        const fat = nz($('#bf')?.value);
        const waist = nz($('#bs')?.value);
        if (weight == null && fat == null && waist == null) return showToast(L('ใส่ค่าอย่างน้อยหนึ่งช่อง', 'Enter at least one value'), 'error');
        if ((weight != null && weight <= 0) || (fat != null && (fat < 0 || fat > 100)) || (waist != null && waist <= 0)) {
          return showToast(L('กรุณาใส่ตัวเลขที่ถูกต้องและไม่ติดลบ', 'Please enter valid non-negative numbers'), 'error');
        }
        safeRun(() => dbPut('body', { id: uid(), date: D, weight, fat, waist }), L('บันทึกสัดส่วนร่างกายแล้ว', 'Saved'));
      },

      // ลบและแก้ไข
      del: (v) => {
        const [store, id] = v.split('|');
        pend = {
          t: L('ต้องการลบรายการนี้ใช่หรือไม่?', 'Delete this item?'),
          f: () => safeRun(async () => {
            if (store === 'meals' && id.includes('#')) {
              const [mid, iid] = id.split('#');
              const m = S.meals.find(x => x.id === mid);
              if (m) {
                m.items = m.items.filter(i => i.id !== iid);
                m.items.length ? await dbPut('meals', m) : await dbDelete('meals', mid);
              }
            } else {
              await dbDelete(store, id);
            }
          }, L('ลบรายการแล้ว', 'Deleted'))
        };
        renderModals();
      },

      ed: (v) => {
        const [s, id, iid] = v.split('|');
        ed = { s, id, iid };
        renderModals();
      },

      edsave: () => {
        if (!ed) return;
        const { s, id, iid } = ed;
        const val = (k) => ($('#' + k)?.value ?? '');

        if (s === 'foods') {
          const n = val('e1').trim();
          const u = val('e2').trim() || L('หน่วย', 'unit');
          const k = nz(val('e3'));
          const p = +val('e4') || 0;
          const c = +val('e5') || 0;
          const f = +val('e6') || 0;
          if (!n || k == null || k < 0 || p < 0 || c < 0 || f < 0) {
            return showToast(L('กรุณากรอกชื่อและค่าตัวเลขที่ไม่ติดลบ', 'Enter name and valid non-negative numbers'), 'error');
          }
          const rec = S.foods.find(x => x.id === id);
          if (!rec) return;
          Object.assign(rec, { n, cat: val('efcat') || 'other', u, k, p, c, f });
          ed = null;
          return safeRun(() => dbPut('foods', rec), L('แก้ไขอาหารส่วนตัวแล้ว', 'Updated'));
        }

        const nd = val('edd');
        if (!nd) return showToast(L('กรุณาเลือกวันที่', 'Please select a date'), 'error');

        if (s === 'meals' && !(Number(val('e1')) > 0)) {
          return showToast(L('ใส่จำนวนมากกว่า 0', 'Enter a quantity above 0'), 'error');
        }
        if (s === 'cardio') {
          const km = Number(val('e1')), min = Number(val('e2')), hr = nz(val('e3'));
          if (!(km > 0 && min > 0) || (hr != null && hr < 0)) {
            return showToast(L('ใส่ระยะทางและเวลามากกว่า 0', 'Enter valid distance, time and HR'), 'error');
          }
        }
        if (s === 'body') {
          const w = nz(val('e1')), f = nz(val('e2')), ws = nz(val('e3'));
          if (w == null && f == null && ws == null) return showToast(L('ใส่ค่าอย่างน้อยหนึ่งช่อง', 'Enter at least one value'), 'error');
          if ((w != null && w <= 0) || (f != null && (f < 0 || f > 100)) || (ws != null && ws <= 0)) {
            return showToast(L('กรุณาใส่ตัวเลขที่ถูกต้องและไม่ติดลบ', 'Enter valid non-negative numbers'), 'error');
          }
        }

        let parsedWorkoutEx = null;
        let workoutDur = null;
        if (s === 'workouts') {
          workoutDur = nz(val('edur'));
          if (workoutDur != null && workoutDur < 0) {
            return showToast(L('ระยะเวลาต้องไม่ติดลบ', 'Duration cannot be negative'), 'error');
          }
          const lines = val('e2').split('\n');
          parsedWorkoutEx = [];
          for (let li = 0; li < lines.length; li++) {
            const line = lines[li].trim();
            if (!line) continue;
            const idx = line.indexOf(':');
            if (idx < 1) {
              return showToast(
                L(`บรรทัดที่ ${li + 1} รูปแบบไม่ถูกต้อง (ต้องมีเครื่องหมาย : คั่นชื่อท่ากับเซ็ต)`, `Line ${li + 1} is invalid (missing ":" after exercise name)`),
                'error'
              );
            }
            const sets = line.slice(idx + 1).split(',')
              .map(part => part.match(/(\d+)\s*[x×]\s*([\d.]*)(?:\s*@\s*([\d.]+))?(\s*(?:ไม่เสร็จ|not done))?/i))
              .filter(Boolean)
              .map(m => ({ reps: +m[1], w: nz(m[2]), rpe: nz(m[3]), done: !m[4] }));
            if (!sets.length) {
              return showToast(
                L(`บรรทัดที่ ${li + 1} ไม่มีข้อมูลเซ็ตที่ถูกต้อง (ใช้รูปแบบ เช่น 10x60)`, `Line ${li + 1} has no valid sets (use e.g. 10x60)`),
                'error'
              );
            }
            parsedWorkoutEx.push({ name: line.slice(0, idx).trim(), sets });
          }
          if (!parsedWorkoutEx.length) {
            return showToast(L('รูปแบบท่าออกกำลังกายไม่ถูกต้อง เช่น Bench Press: 10x60', 'Invalid format. Use e.g. Bench Press: 10x60'), 'error');
          }
        }

        safeRun(async () => {
          if (s === 'meals') {
            const m = S.meals.find(x => x.id === id);
            const item = m.items.find(x => x.id === iid);
            const q = +val('e1');
            const ratio = q / item.q;
            const newType = val('emtypec').trim() || val('emtype') || m.type;
            Object.assign(item, { q, k: item.k * ratio, p: item.p * ratio, c: item.c * ratio, f: item.f * ratio });

            if (nd !== m.date || newType !== m.type) {
              m.items = m.items.filter(x => x !== item);
              const target = S.meals.find(x => x.date === nd && x.type === newType) || { id: uid(), date: nd, type: newType, items: [] };
              target.items.push(item);
              await dbPut('meals', target);
              m.items.length ? await dbPut('meals', m) : await dbDelete('meals', m.id);
            } else {
              await dbPut('meals', m);
            }
          } else {
            const rec = S[s].find(x => x.id === id);
            rec.date = nd;
            if (s === 'workouts') {
              rec.name = val('e1').trim() || rec.name;
              rec.min = workoutDur;
              rec.exercises = parsedWorkoutEx;
            } else if (s === 'cardio') {
              rec.type = val('e0');
              rec.km = +val('e1');
              rec.min = +val('e2');
              rec.hr = nz(val('e3'));
            } else {
              rec.weight = nz(val('e1'));
              rec.fat = nz(val('e2'));
              rec.waist = nz(val('e3'));
            }
            await dbPut(s, rec);
          }
          ed = null;
        }, L('แก้ไขเรียบร้อยแล้ว', 'Updated'));
      },

      // วิเคราะห์ & กราฟ
      rg: (v) => { rg = +v; cu = null; render(); },
      clrcu: () => { cu = null; render(); },
      anbm: (v) => { anBodyMetric = v; render(); },
      tipk: (v) => {
        const [dt, kcal, partial] = v.split('|');
        const el = $('#chart-tip-k');
        if (el) el.textContent = `${fmt(dt, { day: 'numeric', month: 'short' })}: ${Number(kcal).toLocaleString()} kcal${partial === '1' ? L(' (บางส่วน)', ' (partial)') : ''}`;
      },
      tipw: (v) => {
        const [dt, val, unit] = v.split('|');
        const el = $('#chart-tip-w');
        if (el) el.textContent = `${fmt(dt, { day: 'numeric', month: 'short' })}: ${val} ${unit || L('กก.', 'kg')}`;
      },

      // โปรไฟล์ & ตั้งค่า
      savepf: () => {
        let by = nz($('#pby')?.value);
        let beConverted = false;
        if (by != null && by >= 2400 && by <= 2650) {
          by = by - 543;
          beConverted = true;
        }
        const curY = new Date().getFullYear();
        if (by != null && (by < 1900 || by >= curY)) {
          return showToast(L(`กรุณากรอกปีเกิดเป็น ค.ศ. (เช่น 1998)`, `Please enter a valid CE birth year (e.g. 1998)`), 'error');
        }
        const h = nz($('#ph')?.value);
        const gw = nz($('#pgw')?.value);
        if ((h != null && h <= 0) || (gw != null && gw <= 0)) {
          return showToast(L('ส่วนสูงและน้ำหนักเป้าหมายต้องมากกว่า 0', 'Height and goal weight must be above 0'), 'error');
        }
        set.pf = {
          name: ($('#pn')?.value || '').trim(),
          by,
          sx: $('#psx')?.value || '',
          h,
          gw,
          ac: $('#pac')?.value || '1.2',
          gl: $('#pgl')?.value || 'keep'
        };
        saveSet();
        showToast(beConverted
          ? L(`บันทึกโปรไฟล์แล้ว (แปลงปีเกิดเป็น ค.ศ. ${by} อัตโนมัติ)`, `Profile saved (converted birth year to ${by} CE)`)
          : L('บันทึกโปรไฟล์แล้ว', 'Profile saved'));
        render();
      },

      usekcal: () => {
        const e = estimateKcal();
        if (e) { set.kcal = e; set.gs = 1; saveSet(); showToast(L('ตั้งเป้าหมายแคลอรี่แล้ว', 'Calorie goal set')); render(); }
      },

      useall: () => {
        const e = estimateKcal();
        if (e) {
          const m = estimateMacros(e);
          set.kcal = e; set.p = m.p; set.c = m.c; set.f = m.f; set.gs = 1;
          saveSet();
          showToast(L('ตั้งเป้าหมายแคลอรี่และมาโครเรียบร้อยแล้ว', 'Calories & macros goals applied'));
          render();
        }
      },

      saveset: () => {
        const kcal = +($('#sk')?.value || 0);
        const p = +($('#sp')?.value || 0);
        const c = +($('#sc')?.value || 0);
        const f = +($('#sf')?.value || 0);
        const water = +($('#swat')?.value || 2000);
        if (kcal <= 0 || p < 0 || c < 0 || f < 0 || water < 250) {
          return showToast(L('กรุณากรอกค่าเป้าหมายที่ถูกต้อง', 'Please enter valid goal values'), 'error');
        }
        set.kcal = kcal; set.p = p; set.c = c; set.f = f; set.water = water;
        set.th = $('#sth').value;
        set.ws = +$('#sws').value;
        set.gs = 1;
        saveSet();
        applyTheme();
        showToast(L('บันทึกการตั้งค่าแล้ว', 'Settings saved'));
        render();
      },

      lang: () => {
        set.lang = set.lang === 'en' ? 'th' : 'en';
        saveSet();
        applyTheme();
        render();
      },

      // สำรองและส่งออกข้อมูล
      exp: () => {
        const T = todayStr();
        bkTxt = JSON.stringify({ app: 'fitlog', v: 1, at: new Date().toISOString(), settings: set, data: S }, null, 2);
        try {
          const url = URL.createObjectURL(new Blob([bkTxt], { type: 'application/json' }));
          const a = document.createElement('a');
          a.href = url;
          a.download = `fitlog-backup-${T}.json`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (e) {}
        set.bk = Date.now();
        saveSet();
        showToast(L('สร้างข้อมูลสำรองแล้ว (หากไม่ดาวน์โหลด สามารถคัดลอกจากกล่องด้านล่างได้)', 'Backup created (you can also copy from the box below)'));
        render();
      },

      csv: () => {
        const T = todayStr();
        const H = ['type', 'date', 'name', 'quantity', 'unit', 'kcal', 'protein', 'carb', 'fat', 'reps', 'weight_kg', 'rpe', 'done', 'km', 'minutes', 'hr', 'body_fat_pct', 'waist_cm'];
        const q = (v) => (v == null ? '' : `"${String(v).replace(/"/g, '""')}"`);
        const rows = [
          ...S.meals.flatMap(m => m.items.map(i => ({ type: 'meal:' + m.type, date: m.date, name: i.n, quantity: i.q, unit: i.u, kcal: r1(i.k), protein: r1(i.p), carb: r1(i.c), fat: r1(i.f) }))),
          ...S.workouts.flatMap(w => w.exercises.flatMap(ex => ex.sets.map(st => ({ type: 'strength', date: w.date, name: `${w.name} / ${ex.name}`, reps: st.reps, weight_kg: st.w, rpe: st.rpe, done: st.done === false ? 'false' : 'true', minutes: w.min })))),
          ...S.cardio.map(c => ({ type: 'cardio', date: c.date, name: c.type, km: c.km, minutes: c.min, hr: c.hr })),
          ...S.body.map(b => ({ type: 'body', date: b.date, weight_kg: b.weight, body_fat_pct: b.fat, waist_cm: b.waist }))
        ];
        bkTxt = [H.join(','), ...rows.map(o => H.map(h => q(o[h])).join(','))].join('\n');
        try {
          const url = URL.createObjectURL(new Blob(['\ufeff' + bkTxt], { type: 'text/csv' }));
          const a = document.createElement('a');
          a.href = url;
          a.download = `fitlog-${T}.csv`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (e) {}
        showToast(L('สร้างไฟล์ CSV แล้ว', 'CSV created'));
        render();
      },

      cp: () => {
        const ta = $('#bkt');
        if (!ta) return;
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        showToast(ok ? L('คัดลอกข้อความแล้ว', 'Copied to clipboard') : L('กรุณากด Ctrl+C เพื่อคัดลอก', 'Press Ctrl+C to copy'), ok ? 'ok' : 'info');
      }
    };

    /* ============================================================================
     * 14. EVENT LISTENERS & AUTO-SAVE NOTE
     * ============================================================================ */
    let noteSaveTimer = null;
    let noteClearTimer = null;
    const saveNoteSilently = async (dateKey, noteText) => {
      try {
        const updated = { ...dayRec(dateKey), note: noteText };
        const idx = S.days.findIndex(x => x.id === dateKey);
        if (idx >= 0) S.days[idx] = updated; else S.days.push(updated);
        await dbPut('days', updated);
        const statusEl = $('#note-status');
        if (D === dateKey && statusEl) {
          statusEl.textContent = L('บันทึกแล้ว', 'Saved');
          clearTimeout(noteClearTimer);
          noteClearTimer = setTimeout(() => {
            if (D === dateKey && $('#note-status')) $('#note-status').textContent = '';
          }, 1800);
        }
      } catch (err) {
        const statusEl = $('#note-status');
        if (D === dateKey && statusEl) statusEl.textContent = L('บันทึกไม่สำเร็จ', 'Save failed');
      }
    };

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-a]');
      if (btn && A[btn.dataset.a]) A[btn.dataset.a](btn.dataset.v, e);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && (pend || ed)) {
        pend = null; ed = null; renderModals();
      }
    });

    document.addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'wn') {
        draft.name = e.target.value;
        saveDraft();
      } else if (id === 'wdur') {
        draft.min = e.target.value;
        saveDraft();
      } else if (id === 'en') {
        const hint = $('#last-ex-hint');
        if (hint) hint.innerHTML = renderLastExHint(e.target.value);
      } else if (id === 'fsr') {
        fs = e.target.value;
        const resEl = $('#res');
        if (resEl) resEl.innerHTML = renderFoodResults();
      } else if (id === 'fq') {
        updateFoodPreview();
      } else if (e.target.dataset.note) {
        const dk = e.target.dataset.note;
        const val = e.target.value;
        clearTimeout(noteSaveTimer);
        noteSaveTimer = setTimeout(() => saveNoteSilently(dk, val), 450);
      }
    });

    document.addEventListener('change', (e) => {
      const t = e.target;
      if (t.id === 'ft' || t.id === 'qft') {
        lastMealType = t.value;
        return;
      }
      if (t.dataset.note) {
        clearTimeout(noteSaveTimer);
        saveNoteSilently(t.dataset.note, t.value);
        return;
      }
      const c = t.dataset.c;
      if (!c) return;
      if (c === 'setd' && t.value) { D = t.value; cm = D.slice(0, 7); render(); }
      else if (c === 'cua' || c === 'cub') { cu = cu || {}; cu[c === 'cua' ? 'a' : 'b'] = t.value; render(); }
      else if (c === 'flt') { F[t.dataset.v] = t.checked ? 1 : 0; render(); }
      else if (c === 'st') safeRun(() => dbPut('days', { ...dayRec(D), [t.dataset.k]: t.value }));
      else if (c === 'imp' && t.files && t.files[0]) {
        const file = t.files[0];
        t.value = '';
        file.text().then(txt => {
          try {
            const j = JSON.parse(txt);
            if (j.app !== 'fitlog' || !j.data) throw new Error('invalid');
            for (const st of STORES) {
              if (j.data[st] && !(Array.isArray(j.data[st]) && j.data[st].every(r => r && typeof r.id === 'string'))) {
                throw new Error('invalid');
              }
            }
            pend = {
              t: L('การกู้คืนจะแทนที่ข้อมูลทั้งหมดในเครื่องนี้ ควรสร้างข้อมูลสำรองของตอนนี้ไว้ก่อน ดำเนินการต่อหรือไม่?', 'Restoring replaces all data on this device. Back up first. Continue?'),
              f: () => safeRun(async () => {
                bkTxt = JSON.stringify({ app: 'fitlog', v: 1, at: new Date().toISOString(), settings: set, data: S }, null, 2);
                await dbReplaceAll(j.data);
                set = { ...DEFAULT_SET(), ...(j.settings || {}) };
                if (!Array.isArray(set.fav)) set.fav = [];
                if (!set.pf || typeof set.pf !== 'object') set.pf = {};
                fsel = null;
                ed = null;
                saveSet();
                applyTheme();
              }, L('กู้คืนข้อมูลแล้ว สำเนาข้อมูลเดิมอยู่ในกล่องข้อความหน้าตั้งค่า', 'Data restored. A snapshot of previous data is in the text box below.'))
            };
            renderModals();
          } catch (err) {
            showToast(L('ไฟล์สำรองไม่ถูกต้อง ยังไม่มีการเปลี่ยนแปลงข้อมูล', 'Invalid backup file. No changes were made.'), 'error');
          }
        });
      }
    });

    // ตรวจสอบการเปลี่ยนวันข้ามเที่ยงคืนอัตโนมัติ
    setInterval(() => {
      const nowT = todayStr();
      if (nowT !== lastKnownToday) {
        if (D === lastKnownToday) { D = nowT; cm = nowT.slice(0, 7); }
        lastKnownToday = nowT;
        render();
      }
    }, 60000);

    /* ============================================================================
     * 15. INITIALIZATION (เริ่มต้นแอปพลิเคชัน)
     * ============================================================================ */
    const init = async () => {
      applyTheme();
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
      db = await openDB();
      try {
        await dbLoadAll();
      } catch (e) {
        showToast(L('อ่านข้อมูลไม่สำเร็จ', 'Failed to read data'), 'error');
      }
      render();
    };

    init();
  })();
  </script>
</body>
</html>
